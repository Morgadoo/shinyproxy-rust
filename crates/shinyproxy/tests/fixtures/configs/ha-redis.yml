proxy:
  port: 8080
  authentication: simple
  store-mode: Redis
  stop-proxies-on-shutdown: false
  realm-id: production
  users:
    - name: jack
      password: password
spring:
  session:
    store-type: redis
  data:
    redis:
      host: redis
      port: 6379
      password: redis-secret
      sentinel:
        master: mymaster
        nodes: [ "redis-1:26379", "redis-2:26379" ]
