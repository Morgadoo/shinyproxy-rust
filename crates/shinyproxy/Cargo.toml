[package]
name = "shinyproxy"
description = "ShinyProxy: open source enterprise deployment for data science apps"
default-run = "shinyproxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "shinyproxy"
path = "src/lib.rs"

[[bin]]
name = "shinyproxy"
path = "src/main.rs"

[dependencies]
containerproxy.workspace = true
spel.workspace = true

anyhow.workspace = true
base64.workspace = true
dashmap.workspace = true
futures.workspace = true
lettre.workspace = true
url.workspace = true
uuid.workspace = true
mimalloc.workspace = true
mime_guess.workspace = true
once_cell.workspace = true
percent-encoding.workspace = true
regex.workspace = true
axum.workspace = true
axum-extra.workspace = true
minijinja.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tower-sessions.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
time.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
redis.workspace = true
jsonwebtoken.workspace = true
rsa = { version = "0.9", features = ["pem"] }
rand_old = { package = "rand", version = "0.8" }
base64.workspace = true
tracing-subscriber.workspace = true
insta.workspace = true
reqwest.workspace = true
rstest.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
testapp = { path = "../testapp" }

[build-dependencies]
# the build script stamps the binary with the build time
time = { workspace = true }

[[bench]]
name = "pages"
harness = false
