name: Release

# On a tag (`v0.1.0`, ...) the binaries and the container image are built and attached to the GitHub release,
# with the checksum files the Java releases also published (SHA-256 and MD5).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: Binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          SHINYPROXY_GIT_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked --bin shinyproxy --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="shinyproxy-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/shinyproxy" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          cp -r examples "dist/${name}/examples"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          cd dist
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          md5sum "${name}.tar.gz" > "${name}.tar.gz.md5"

      - name: Check the binary runs
        run: ./target/${{ matrix.target }}/release/shinyproxy --version

      - uses: actions/upload-artifact@v4
        with:
          name: shinyproxy-${{ matrix.target }}
          path: dist/*.tar.gz*

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR repository names must be lowercase; github.repository keeps the owner's casing.
      - name: Image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest

  release:
    name: GitHub release
    needs: [binaries, image]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push' && needs.binaries.result == 'success'
    steps:
      # Only the binary tarballs. docker/build-push-action also uploads a
      # `*.dockerbuild` cache artifact; download-artifact cannot extract it and
      # fails the release if it is included (see run 31983577375).
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: shinyproxy-*
          if-no-files-found: error

      - name: Attach the artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
